name = "hazardastan-crawler"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Database — Single Database for Hazardastan Core
[[d1_databases]]
binding = "DB"
database_name = "hazardastan-db"
database_id = "hazardastan-primary-d1" # Replace with actual D1 UUID from: npx wrangler d1 create hazardastan-db

# Cloudflare KV — Rules, state cache & temporary metadata
[[kv_namespaces]]
binding = "CACHE"
id = "hazardastan-cache-kv" # Replace with actual KV namespace ID (e.g. a83bc92f91a74e8bb...) from: npx wrangler kv namespace list

# Cloudflare Queue — Single Crawl Queue Pipeline
[[queues.producers]]
binding = "CRAWL_QUEUE"
queue = "hazardastan-crawl-queue"

[[queues.consumers]]
queue = "hazardastan-crawl-queue"
max_batch_size = 5
max_concurrency = 3
max_retries = 3

# Cloudflare Cron Triggers — Periodic Crawling (15 min)
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"

