name: Continuous Integration

on:
  push:
    branches: [ "main", "develop", "sprint-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: TypeCheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck (Strict TypeScript)
        run: npm run lint

      - name: Production Bundle Build
        run: npm run build
